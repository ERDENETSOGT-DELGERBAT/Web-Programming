<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Script Loading Demo</title>
  <script src="app.js" defer></script>
  <script src="analytics.js" async></script>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 650px;
      margin: 40px auto;
      padding: 20px;
      color: #283449;
      background: #f5f8fc;
    }
    #status {
      padding: 16px;
      border-radius: 10px;
      margin-top: 20px;
    }
    .pending {
      background: #fff3cd;
      color: #875d00;
    }
    .ok {
      background: #dcfce7;
      color: #166534;
    }
  </style>
</head>
<body>
  <h1>Script Loading Test</h1>
  <p>This page demonstrates the difference between defer and async.</p>
  <div id="status" class="pending">Waiting for the app script...</div>
</body>
</html>
