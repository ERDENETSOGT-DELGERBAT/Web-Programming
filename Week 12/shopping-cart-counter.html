
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart Counter | Week 12</title>
  <link rel="stylesheet" href="week12.css">
</head>
<body>
  <main class="container">
    <a class="back-link" href="index.html">← Back to Week 12</a>

    <header class="page-header">
      <p class="eyebrow">PRACTICE CHALLENGE</p>
      <h1>Shopping Cart Counter</h1>
      <p>Three products with independent quantities. Quantity cannot go below zero, and the total updates automatically.</p>
    </header>

    <section class="work-card">
      <div id="root"></div>
    </section>

    <footer>React State · Objects in State · Week 12</footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.9/babel.min.js"></script>

  <script type="text/babel">
    const { useState } = React;

    const products = [
      { id: 1, name: 'Coffee', price: 4500 },
      { id: 2, name: 'Sandwich', price: 7000 },
      { id: 3, name: 'Water', price: 1000 }
    ];

    const money = new Intl.NumberFormat('en-US', {
      style: 'currency',
      currency: 'KRW',
      maximumFractionDigits: 0
    });

    function ShoppingCart() {
      const [quantities, setQuantities] = useState({
        1: 0,
        2: 0,
        3: 0
      });

      function changeQuantity(id, amount) {
        setQuantities(previous => ({
          ...previous,
          [id]: Math.max(0, previous[id] + amount)
        }));
      }

      const total = products.reduce(
        (sum, product) =>
          sum + product.price * quantities[product.id],
        0
      );

      const totalQuantity = Object.values(quantities).reduce(
        (sum, quantity) => sum + quantity,
        0
      );

      return (
        <div>
          <div className="menu-grid">
            {products.map(product => (
              <article className="menu-item" key={product.id}>
                <h3>{product.name}</h3>

                <p className="price">
                  {money.format(product.price)}
                </p>

                <p className="quantity" aria-live="polite">
                  {quantities[product.id]}
                </p>

                <div className="controls" style={{ justifyContent: 'center' }}>
                  <button
                    type="button"
                    className="secondary"
                    onClick={() => changeQuantity(product.id, -1)}
                    disabled={quantities[product.id] === 0}
                    aria-label={`Decrease ${product.name}`}
                  >
                    −
                  </button>

                  <button
                    type="button"
                    onClick={() => changeQuantity(product.id, 1)}
                    aria-label={`Increase ${product.name}`}
                  >
                    +
                  </button>
                </div>
              </article>
            ))}
          </div>

          <div className="grand-total" aria-live="polite">
            <div>Total items: {totalQuantity}</div>
            <div>Total price: {money.format(total)}</div>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(
      document.getElementById('root')
    ).render(<ShoppingCart />);
  </script>
</body>
</html>
