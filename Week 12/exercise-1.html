<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 1 — Toggle Visibility | Week 12</title>
  <link rel="stylesheet" href="week12.css">
</head>
<body>
  <main class="container">
    <a class="back-link" href="index.html">← Back to Week 12</a>
    <header class="page-header">
      <p class="eyebrow">EXERCISE 01</p>
      <h1>Toggle Visibility</h1>
      <p>Use boolean state to show or hide a paragraph without reloading the page.</p>
    </header>
    <section class="work-card">
      <div id="root"></div>
    </section>
    <footer>React State · Boolean State · Week 12</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.9/babel.min.js"></script>
  <script type="text/babel">
    const { useState } = React;

    function ToggleDetail() {
      const [isVisible, setIsVisible] = useState(false);

      return (
        <div>
          <p className="eyebrow">INTERACTIVE EXAMPLE</p>
          <h2 className="section-title">React State Details</h2>
          <button
            type="button"
            onClick={() => setIsVisible(previous => !previous)}
            aria-expanded={isVisible}
            aria-controls="detail-text"
          >
            {isVisible ? 'Hide details' : 'Show details'}
          </button>
          {isVisible && (
            <div className="toggle-content" id="detail-text">
              <p>React state enables dynamic user interfaces without page reloads.</p>
              <p>When the state changes, React updates the parts of the page that need to change.</p>
            </div>
          )}
          <p className="notice">Current state: <strong>{isVisible ? 'Visible (true)' : 'Hidden (false)'}</strong></p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ToggleDetail />);
  </script>
</body>
</html>
