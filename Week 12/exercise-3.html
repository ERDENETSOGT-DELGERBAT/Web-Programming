<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exercise 3 — Scoreboard | Week 12</title>
  <link rel="stylesheet" href="week12.css">
</head>
<body>
  <main class="container">
    <a class="back-link" href="index.html">← Back to Week 12</a>
    <header class="page-header">
      <p class="eyebrow">EXERCISE 03</p>
      <h1>Lift State Between Two Counters</h1>
      <p>The parent ScoreBoard owns both scores and passes each child its score and update functions.</p>
    </header>
    <section class="work-card">
      <div id="root"></div>
    </section>
    <footer>React State · Lifting State Up · Week 12</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.9/babel.min.js"></script>
  <script type="text/babel">
    const { useState } = React;

    function PlayerScore({ name, score, onIncrement, onDecrement }) {
      return (
        <article className="score-card">
          <h2>{name}</h2>
          <div className="score-number" aria-live="polite">{score}</div>
          <div className="controls" style={{ justifyContent: 'center' }}>
            <button type="button" className="secondary" onClick={onDecrement} aria-label={`Decrease ${name}`}>−</button>
            <button type="button" onClick={onIncrement} aria-label={`Increase ${name}`}>+</button>
          </div>
        </article>
      );
    }

    function ScoreBoard() {
      const [p1, setP1] = useState(0);
      const [p2, setP2] = useState(0);

      return (
        <div>
          <p className="eyebrow center">PLAYER SCORES</p>
          <div className="score-grid">
            <PlayerScore
              name="Player 1"
              score={p1}
              onIncrement={() => setP1(previous => previous + 1)}
              onDecrement={() => setP1(previous => previous - 1)}
            />
            <PlayerScore
              name="Player 2"
              score={p2}
              onIncrement={() => setP2(previous => previous + 1)}
              onDecrement={() => setP2(previous => previous - 1)}
            />
          </div>
          <div className="total-score" aria-live="polite">Combined Total: {p1 + p2}</div>
          <div className="center" style={{ marginTop: '16px' }}>
            <button className="secondary" type="button" onClick={() => { setP1(0); setP2(0); }}>Reset scores</button>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ScoreBoard />);
  </script>
</body>
</html>
