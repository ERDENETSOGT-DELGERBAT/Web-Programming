<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Counter with History | Week 12</title>
  <link rel="stylesheet" href="week12.css">
</head>
<body>
  <main class="container">
    <a class="back-link" href="index.html">← Back to Week 12</a>
    <header class="page-header">
      <p class="eyebrow">CODE CHALLENGE</p>
      <h1>Counter with History</h1>
      <p>Use two state variables: the current count and an array containing the last five values.</p>
    </header>
    <section class="work-card">
      <div id="root"></div>
    </section>
    <footer>React State · useState · Week 12</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.9/babel.min.js"></script>
  <script type="text/babel">
    const { useState } = React;

    function CounterWithHistory() {
      const [count, setCount] = useState(0);
      const [history, setHistory] = useState([0]);

      function saveCount(nextValue) {
        if (nextValue === count) return;
        setCount(nextValue);
        setHistory(previous => [...previous, nextValue].slice(-5));
      }

      function undo() {
        if (history.length < 2) return;
        setCount(history[history.length - 2]);
        setHistory(previous => previous.slice(0, -1));
      }

      return (
        <div>
          <p className="eyebrow center">CURRENT COUNT</p>
          <div className="count-display" aria-live="polite">{count}</div>
          <div className="controls" style={{ justifyContent: 'center' }}>
            <button type="button" onClick={() => saveCount(count + 1)}>+1</button>
            <button type="button" className="secondary" onClick={() => saveCount(count - 1)}>−1</button>
            <button type="button" className="secondary" onClick={() => saveCount(0)}>Reset</button>
            <button type="button" onClick={undo} disabled={history.length < 2}>Undo</button>
          </div>
          <div className="history-box">
            <strong>History — last five values</strong>
            <div className="history-values" aria-live="polite">
              {history.map((value, index) => <span key={index}>{value}</span>)}
            </div>
          </div>
          <p className="notice">Undo restores the previous value and removes the most recent value from the history.</p>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<CounterWithHistory />);
  </script>
</body>
</html>
