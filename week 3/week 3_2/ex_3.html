<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <style>
body {
  display:flex;
  justify-content:center;
  align-items:center;
  height:200px;
  background:#f0fdfa;
}
@keyframes spin {
  from {
    transform:rotate(0);
  }
  to {
    transform:rotate(360deg);
  }
}
.spinner {
  width:50px;
  height:50px;
  border-radius:50%;
  border:4px solid #ccfbf1;
  border-top-color:#0f766e;
  animation:spin .8s linear infinite;
}
  </style>
 </head>
 <body>
  <div class="spinner">
  </div>
 </body>
</html>
