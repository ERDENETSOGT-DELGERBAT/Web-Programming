<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width,initial-scale=1.0" name="viewport"/>
  <style>
* {
  box-sizing:border-box;
  margin:0;
  padding:0;
}
body {
  font-family:sans-serif;
}
.nav {
  position:fixed;
  top:0;
  left:0;
  right:0;
  background:#1e293b;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:16px 32px;
}
.nav-logo {
  color:#14b8a6;
  font-size:1.3rem;
  font-weight:bold;
  text-decoration:none;
}
.nav-links {
  display:flex;
  gap:24px;
}
.nav-links a {
  color:#94a3b8;
  text-decoration:none;
}
.nav-links a:hover {
  color:#14b8a6;
}
.content {
  padding-top:70px;
}
.section {
  height:300px;
  padding:40px;
  font-size:18px;
}
  </style>
 </head>
 <body>
  <nav class="nav">
   <a class="nav-logo" href="#">
    DELGERBAT
   </a>
   <div class="nav-links">
    <a href="#s1">
     Home
    </a>
    <a href="#s2">
     Topics
    </a>
    <a href="#s3">
     Quiz
    </a>
   </div>
  </nav>
  <div class="content">
   <div class="section" id="s1" style="background:#f0fdfa">
    Section 1 — scroll down...
   </div>
   <div class="section" id="s2" style="background:#ccfbf1">
    Section 2 — nav stays fixed!
   </div>
   <div class="section" id="s3" style="background:#99f6e4">
    Section 3
   </div>
  </div>
 </body>
</html>
