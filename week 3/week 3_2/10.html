<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Media Queries
  </title>
  <style>
body {
  font-family:sans-serif;
  padding:16px;
  background:#f0fdfa;
}
.grid {
  display:flex;
  flex-direction:column;
  gap:16px;
}
.card {
  background:white;
  border:2px solid #14b8a6;
  border-radius:10px;
  padding:20px;
  color:#0f766e;
}
.label {
  font-size:14px;
  background:#0f766e;
  color:white;
  padding:6px 12px;
  border-radius:4px;
  display:inline-block;
  margin-bottom:12px;
}
@media(min-width:640px) {
  .grid {
    flex-direction:row;
    flex-wrap:wrap;
  }
  .card {
    flex:1;
    min-width:200px;
  }
}
@media(prefers-color-scheme:dark) {
  body {
    background:#051a0a;
  }
  .card {
    background:#0b2017;
    color:#d4edda;
  }
}
@media print {
  .label {
    display:none;
  }
  body {
    background:white;
  }
}
  </style>
 </head>
 <body>
  <div class="label">
   Resize the window to see the layout change.
  </div>
  <div class="grid">
   <div class="card">
    Card One
   </div>
   <div class="card">
    Card Two
   </div>
   <div class="card">
    Card Three
   </div>
  </div>
 </body>
</html>
