<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Color Property</title>
  <style>
    body {
      color: #1e293b;
    }
    .red {
      color: red;
    }
    .green {
      color: #0f766e;
    }
    .blue {
      color: rgb(29, 78, 216);
    }
    .purple {
      color: hsl(262, 83%, 58%);
    }
    .muted {
      color: #94a3b8;
    }
    h2 {
      color: #14b8a6;
    }
  </style>
</head>
<body>
  <h2>CSS Color Examples</h2>
  <p class="red">Named colour: red</p>
  <p class="green">Hex colour: #0f766e</p>
  <p class="blue">RGB colour</p>
  <p class="purple">HSL colour</p>
  <p class="muted">Muted grey text</p>
</body>
</html>
