<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Margin</title>
  <style>
    .box {
      background: #ecfdf5;
      border: 2px solid #14B8A6;
      padding: 12px;
      width: 280px;
    }
    .none { margin: 0; }
    .all { margin: 20px; }
    .auto { margin: 0 auto; }
    .sides {
      margin-left: 40px;
      margin-right: 40px;
    }
  </style>
</head>
<body>
  <div class="box none">margin: 0</div>
  <div class="box all">margin: 20px</div>
  <div class="box auto">margin: 0 auto</div>
  <div class="box sides">side margins</div>
</body>
</html>
