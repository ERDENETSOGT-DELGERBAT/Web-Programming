<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hex Color Codes</title>
  <style>
    .red {
      background-color: #FF0000;
    }
    .green {
      background-color: #00FF00;
    }
    .blue {
      background-color: #0000FF;
      color: white;
    }
    .white {
      background-color: #FFFFFF;
      border: 1px solid #ccc;
    }
    .black {
      background-color: #000000;
      color: white;
    }
    .custom {
      background-color: #14B8A6;
      color: white;
    }
    div {
      padding: 8px 16px;
      margin: 4px;
      display: inline-block;
    }
  </style>
</head>
<body>
  <div class="red">#FF0000 Red</div>
  <div class="green">#00FF00 Green</div>
  <div class="blue">#0000FF Blue</div>
  <div class="white">#FFFFFF White</div>
  <div class="black">#000000 Black</div>
  <div class="custom">#14B8A6 Teal</div>
</body>
</html>
