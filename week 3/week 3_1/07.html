<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Type Selector</title>
  <style>
    h1 {
      color: #0f766e;
    }
    h2 {
      color: #1d4ed8;
      font-size: 1.4rem;
    }
    p {
      font-size: 1rem;
      line-height: 1.7;
      color: #334155;
    }
    a {
      color: #14b8a6;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    p.lead {
      font-size: 1.2rem;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <h1>Main Heading</h1>
  <h2>Sub Heading</h2>
  <p class="lead">Lead paragraph.</p>
  <p>Normal paragraph. <a href="#">A link.</a></p>
</body>
</html>
