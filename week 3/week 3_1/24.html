<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Comments</title>
  <style>
    /* This is a CSS comment. */
    body {
      font-family: sans-serif;
      color: #1e293b;
    }

    /* Navigation */
    nav {
      display: flex;
      gap: 16px;
    }
  </style>
</head>
<body>
  <nav>
    <a href="#">Home</a>
    <a href="#">About</a>
  </nav>
  <p>CSS comments are ignored by the browser.</p>
</body>
</html>
