<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DELGERBAT — CSS Profile</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: sans-serif;
      font-size: 1rem;
      line-height: 1.6;
      background: #f0fdfa;
      color: #1e293b;
    }

    .container {
      max-width: 700px;
      margin: 40px auto;
      padding: 0 20px;
    }

    .card {
      background: white;
      border: 1px solid #99f6e4;
      border-radius: 16px;
      padding: 40px;
    }

    .profile-header {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 28px;
    }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #0f766e;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }

    h1 {
      font-size: 1.75rem;
      color: #0f766e;
    }

    .role {
      color: #64748b;
      font-size: 0.9rem;
    }

    .skills {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .skill {
      background: #ccfbf1;
      color: #0f766e;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <div class="profile-header">
        <div class="avatar">D</div>
        <div>
          <h1>DELGERBAT</h1>
          <p class="role">Computer Engineering Student · Gachon University</p>
        </div>
      </div>

      <p>Hello! I am learning HTML and CSS in Web Programming. I also enjoy gaming.</p>

      <div class="skills">
        <span class="skill">Researching</span>
        <span class="skill">Communication</span>
        <span class="skill">Emotional Intelligence</span>
      </div>
    </div>
  </div>
</body>
</html>
