<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
    }
    .palette {
      display: flex;
      gap: 12px;
      padding: 20px;
      background: #f8fafc;
      border-radius: 12px;
    }
    .swatch {
      width: 100px;
      height: 100px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-weight: bold;
    }
    .c1 { background-color: #0F766E; }
    .c2 { background-color: #14B8A6; }
    .c3 { background-color: #3B82F6; }
    .c4 { background-color: #7C3AED; }
    .c5 { background-color: #F59E0B; }
  </style>
</head>
<body>
  <div class="palette">
    <div class="swatch c1">#0F766E</div>
    <div class="swatch c2">#14B8A6</div>
    <div class="swatch c3">#3B82F6</div>
    <div class="swatch c4">#7C3AED</div>
    <div class="swatch c5">#F59E0B</div>
  </div>
</body>
</html>
