<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RGB Color Values</title>
  <style>
    .red { background-color: rgb(255, 0, 0); color: white; }
    .green { background-color: rgb(21, 128, 61); color: white; }
    .blue { background-color: rgb(29, 78, 216); color: white; }
    .grey { background-color: rgb(100, 100, 100); color: white; }
    .transparent {
      background-color: rgba(20, 184, 166, 0.2);
      padding: 20px;
    }
    div {
      padding: 8px 16px;
      margin: 6px;
    }
  </style>
</head>
<body>
  <div class="red">RGB Red</div>
  <div class="green">RGB Green</div>
  <div class="blue">RGB Blue</div>
  <div class="grey">RGB Grey</div>
  <div class="transparent">RGBA transparent teal</div>
</body>
</html>
