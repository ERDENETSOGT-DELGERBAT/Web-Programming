<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Box Model Width</title>
  <style>
    .content-box {
      box-sizing: content-box;
      width: 200px;
      padding: 10px;
      border: 5px solid #14B8A6;
      background: #ecfdf5;
      margin-bottom: 16px;
    }
    .border-box {
      box-sizing: border-box;
      width: 200px;
      padding: 10px;
      border: 5px solid #7c3aed;
      background: #f5f3ff;
    }
  </style>
</head>
<body>
  <div class="content-box">content-box</div>
  <p>Actual width is 230px.</p>

  <div class="border-box">border-box</div>
  <p>Actual width is 200px.</p>
</body>
</html>
