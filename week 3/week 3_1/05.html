<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ID Selector</title>
  <style>
    #main-title {
      color: #0f766e;
      font-size: 2.5rem;
      border-left: 5px solid #14b8a6;
      padding-left: 12px;
    }
    #hero-banner {
      background: #f0fdfa;
      padding: 40px;
      border-radius: 12px;
    }
  </style>
</head>
<body>
  <div id="hero-banner">
    <h1 id="main-title">CSS Introduction</h1>
    <p>This heading is styled with an ID selector.</p>
  </div>
</body>
</html>
