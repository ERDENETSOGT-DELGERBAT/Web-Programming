<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Font Size</title>
  <style>
    .small { font-size: 0.875rem; }
    .base { font-size: 1rem; }
    .large { font-size: 1.25rem; }
    .extra { font-size: 1.5rem; }
    .heading { font-size: 2rem; }
  </style>
</head>
<body>
  <p class="small">0.875rem — small text</p>
  <p class="base">1rem — normal text</p>
  <p class="large">1.25rem — large text</p>
  <p class="extra">1.5rem — extra large</p>
  <p class="heading">2rem — heading size</p>
</body>
</html>
