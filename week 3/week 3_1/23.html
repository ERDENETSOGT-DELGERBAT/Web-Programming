<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Selector Specificity</title>
  <style>
    p { color: gray; }
    .highlight { color: blue; }
    p.highlight { color: purple; }
    #note { color: green; }
    div p { font-style: italic; }
    div .highlight { font-weight: bold; }
  </style>
</head>
<body>
  <p>Plain paragraph</p>
  <p class="highlight">Paragraph with class</p>
  <div>
    <p class="highlight" id="note">Paragraph with class and ID</p>
  </div>
</body>
</html>
