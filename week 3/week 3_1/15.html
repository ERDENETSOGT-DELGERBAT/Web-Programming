<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Text Align</title>
  <style>
    .left { text-align: left; }
    .center { text-align: center; }
    .right { text-align: right; }
    .justify { text-align: justify; }
    div {
      border: 1px dashed #cbd5e1;
      padding: 12px;
      margin: 8px 0;
      max-width: 500px;
    }
    .centered-box {
      width: 300px;
      margin: 0 auto;
      background: #f0fdfa;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="left">Text aligned left</div>
  <div class="center">Text aligned center</div>
  <div class="right">Text aligned right</div>
  <div class="justify">This text is justified inside the box.</div>
  <div class="centered-box">This box is centered.</div>
</body>
</html>
