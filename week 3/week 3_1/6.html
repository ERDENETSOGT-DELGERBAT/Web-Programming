<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Class Selector</title>
  <style>
    .card {
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 20px;
      margin: 10px;
    }
    .featured {
      border-color: #14b8a6;
      background: #f0fdfa;
    }
    .large {
      font-size: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="card">Plain card</div>
  <div class="card featured">Featured card</div>
  <div class="card featured large">Featured and large card</div>
</body>
</html>
