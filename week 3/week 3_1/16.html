<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Padding</title>
  <style>
    .box {
      background: #ecfdf5;
      border: 2px solid #14B8A6;
      width: 300px;
      font-family: sans-serif;
      margin-bottom: 10px;
    }
    .none { padding: 0; }
    .all { padding: 20px; }
    .sides { padding: 10px 40px; }
  </style>
</head>
<body>
  <div class="box none">padding: 0</div>
  <div class="box all">padding: 20px</div>
  <div class="box sides">padding: 10px 40px</div>
</body>
</html>
