<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Display None</title>
  <style>
    .box {
      padding: 16px;
      margin: 8px 0;
      border: 2px solid #14B8A6;
    }
    .hidden {
      display: none;
    }
    .invisible {
      visibility: hidden;
    }
    .transparent {
      opacity: 0;
    }
  </style>
</head>
<body>
  <div class="box">Box 1 — visible</div>
  <div class="box hidden">Box 2 — hidden</div>
  <div class="box">Box 3 — visible</div>
  <div class="box invisible">Box 4 — invisible</div>
  <div class="box">Box 5 — visible</div>
</body>
</html>
