<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Exercise 4</title>

  <style>
    body {
      font-family: system-ui;
      padding: 20px;
      max-width: 420px;
      margin: auto;
    }

    h2 {
      color: #1a56db;
    }

    #search {
      width: 100%;
      padding: 10px 14px;
      font-size: 16px;
      border: 2px solid #1a56db;
      border-radius: 10px;
      margin-bottom: 14px;
      box-sizing: border-box;
    }

    .student {
      padding: 10px 14px;
      margin-bottom: 6px;
      background: #f0f4ff;
      border-radius: 8px;
      border: 1px solid #c8d4f0;
      font-size: 15px;
    }

    #no-results {
      display: none;
      color: #9ca3af;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>
<body>

  <h2>Student Search</h2>

  <input id="search" type="text" placeholder="Search students...">

  <div id="student-list">
    <div class="student" data-name="DELGERBAT">DELGERBAT — Computer Engineering</div>
    <div class="student" data-name="Bat">Bat — Computer Science</div>
    <div class="student" data-name="Min">Min — Software Engineering</div>
    <div class="student" data-name="Jin">Jin — Artificial Intelligence</div>
    <div class="student" data-name="Yuna">Yuna — Data Science</div>
    <div class="student" data-name="Seojun">Seojun — Web Programming</div>
  </div>

  <p id="no-results">No students found.</p>

  <script>
    const searchInp = document.querySelector('#search');
    const students = document.querySelectorAll('.student');
    const noResults = document.querySelector('#no-results');

    searchInp.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase();
      let visible = 0;

      students.forEach(s => {
        const name = s.dataset.name.toLowerCase();

        if (name.includes(term)) {
          s.style.display = '';
          visible++;
        } else {
          s.style.display = 'none';
        }
      });

      noResults.style.display = visible === 0 ? 'block' : 'none';
    });
  </script>

</body>
</html>
