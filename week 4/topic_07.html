<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Topic 7</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 30px;
      text-align: center;
    }

    button {
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #count-display {
      font-size: 24px;
      margin: 20px;
    }
  </style>
</head>
<body>

  <button id="count-btn">Click me</button>

  <p id="count-display">0</p>

  <script>
    let count = 0;
    const btn = document.querySelector('#count-btn');
    const display = document.querySelector('#count-display');

    btn.addEventListener('click', () => {
      count++;
      display.textContent = count;
    });
  </script>

</body>
</html>
