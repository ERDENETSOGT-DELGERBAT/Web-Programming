<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Topic 4</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 30px;
    }

    button {
      padding: 10px 18px;
      margin-right: 8px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    #text {
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <h1 id="text">Hello</h1>

  <button id="change">Change Text</button>
  <button id="html">Show HTML</button>

  <script>
    const text = document.querySelector('#text');

    document.querySelector('#change').addEventListener('click', () => {
      text.textContent = 'Welcome to Web Programming!';
    });

    document.querySelector('#html').addEventListener('click', () => {
      text.textContent = '<b>This is text</b>';
    });
  </script>

</body>
</html>
