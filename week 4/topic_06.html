<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Topic 6</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 30px;
      text-align: center;
    }

    .card {
      padding: 30px;
      margin: 20px auto;
      max-width: 300px;
      background-color: #f0fdfa;
      border-radius: 10px;
    }

    .dark {
      background-color: #1e293b;
      color: white;
    }

    .big {
      font-size: 24px;
    }

    button {
      padding: 10px 18px;
      margin: 5px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="card" class="card">ClassList Demo</div>

  <button id="dark">Toggle Dark</button>
  <button id="big">Toggle Big</button>

  <script>
    const card = document.querySelector('#card');

    document.querySelector('#dark').addEventListener('click', () => {
      card.classList.toggle('dark');
    });

    document.querySelector('#big').addEventListener('click', () => {
      card.classList.toggle('big');
    });
  </script>

</body>
</html>
