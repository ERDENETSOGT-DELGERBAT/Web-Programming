<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Topic 10</title>
  <style>
    body {
      font-family: sans-serif;
      padding: 30px;
      max-width: 500px;
      margin: auto;
    }

    .item {
      display: flex;
      justify-content: space-between;
      padding: 12px;
      margin-bottom: 8px;
      background-color: #f0fdfa;
      border-radius: 8px;
    }

    button {
      border: none;
      background-color: #dc2626;
      color: white;
      border-radius: 6px;
      padding: 5px 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <h1>My List</h1>

  <div id="list">
    <div class="item">
      <span>HTML</span>
      <button class="delete-btn">Delete</button>
    </div>

    <div class="item">
      <span>CSS</span>
      <button class="delete-btn">Delete</button>
    </div>

    <div class="item">
      <span>JavaScript</span>
      <button class="delete-btn">Delete</button>
    </div>
  </div>

  <script>
    const list = document.querySelector('#list');

    list.addEventListener('click', (e) => {
      if (e.target.classList.contains('delete-btn')) {
        e.target.parentElement.remove();
      }
    });
  </script>

</body>
</html>
