<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Interactive Shopping Cart Homework | Week 12</title>
  <link rel="stylesheet" href="week12.css">
</head>
<body>
  <main class="container">
    <a class="back-link" href="index.html">← Back to Week 12</a>
    <header class="page-header">
      <p class="eyebrow">HOMEWORK</p>
      <h1>Interactive Shopping Cart</h1>
      <p>Browse at least five products, add or remove them, change quantities, and see the total price calculated from cart state.</p>
    </header>
    <section class="work-card">
      <div id="root"></div>
    </section>
    <footer>React State · ShoppingCart Component · Week 12</footer>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.9/babel.min.js"></script>
  <script type="text/babel">
    const { useState } = React;
    const products = [
      {
        id: 1,
        name: 'Coffee',
        description: 'Freshly brewed coffee',
        price: 4500,
        image: 'https://images.unsplash.com/photo-1509042239860-f550ce710b93?auto=format&fit=crop&w=700&q=80'
      },
      {
        id: 2,
        name: 'Sandwich',
        description: 'Fresh sandwich',
        price: 7000,
        image: 'https://images.unsplash.com/photo-1528735602780-2552fd46c7af?auto=format&fit=crop&w=700&q=80'
      },
      {
        id: 3,
        name: 'Water Bottle',
        description: 'Still drinking water',
        price: 1000,
        image: 'https://images.unsplash.com/photo-1602143407151-7111542de6e8?auto=format&fit=crop&w=700&q=80'
      },
      {
        id: 4,
        name: 'Headphones',
        description: 'Wireless headphones',
        price: 89000,
        image: 'https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=700&q=80'
      },
      {
        id: 5,
        name: 'Backpack',
        description: 'Everyday backpack',
        price: 45000,
        image: 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=700&q=80'
      }
    ];
    const money = new Intl.NumberFormat('ko-KR', { style: 'currency', currency: 'KRW', maximumFractionDigits: 0 });

    function ShoppingCart() {
      const [cartItems, setCartItems] = useState([]);

      function addToCart(product) {
        setCartItems(previous => {
          const existingItem = previous.find(item => item.id === product.id);
          if (existingItem) {
            return previous.map(item => item.id === product.id
              ? { ...item, quantity: item.quantity + 1 }
              : item
            );
          }
          return [...previous, { ...product, quantity: 1 }];
        });
      }

      function changeQuantity(id, amount) {
        setCartItems(previous => previous.flatMap(item => {
          if (item.id !== id) return [item];
          const nextQuantity = item.quantity + amount;
          return nextQuantity <= 0 ? [] : [{ ...item, quantity: nextQuantity }];
        }));
      }

      function removeItem(id) {
        setCartItems(previous => previous.filter(item => item.id !== id));
      }

      const totalPrice = cartItems.reduce(
        (sum, item) => sum + item.price * item.quantity,
        0
      );
      const totalQuantity = cartItems.reduce((sum, item) => sum + item.quantity, 0);

      return (
        <div className="cart-layout">
          <section aria-label="Product list">
            <h2 className="section-title">Product List</h2>
            <div className="product-grid">
              {products.map(product => (
                <article className="product-card" key={product.id}>
                  <img
                    src={product.image}
                    alt={product.name}
                    loading="lazy"
                    onError={event => { event.currentTarget.src = 'https://placehold.co/700x450/f8fafc/0f766e?text=Product'; }}
                  />
                  <div className="product-info">
                    <h3>{product.name}</h3>
                    <p>{money.format(product.price)}</p>
                    <button type="button" onClick={() => addToCart(product)}>Add to Cart</button>
                  </div>
                </article>
              ))}
            </div>
          </section>

          <aside className="cart-sidebar" aria-label="Shopping cart">
            <h2>Shopping Cart</h2>
            <p className="cart-count" aria-live="polite">{totalQuantity} {totalQuantity === 1 ? 'item' : 'items'}</p>
            {cartItems.length === 0 ? (
              <div className="empty-state">Your cart is empty. Add a product to get started.</div>
            ) : (
              <ul className="cart-items">
                {cartItems.map(item => (
                  <li key={item.id}>
                    <div className="cart-item-top">
                      <span className="cart-item-name">{item.name}</span>
                      <strong>{money.format(item.price * item.quantity)}</strong>
                    </div>
                    <div className="cart-item-price">{money.format(item.price)} each</div>
                    <div className="cart-quantity">
                      <button type="button" className="secondary" onClick={() => changeQuantity(item.id, -1)} aria-label={`Decrease ${item.name}`}>−</button>
                      <strong>{item.quantity}</strong>
                      <button type="button" onClick={() => changeQuantity(item.id, 1)} aria-label={`Increase ${item.name}`}>+</button>
                      <button type="button" className="danger" onClick={() => removeItem(item.id)}>Remove</button>
                    </div>
                  </li>
                ))}
              </ul>
            )}
            <div className="cart-total">
              <span>Total</span>
              <span>{money.format(totalPrice)}</span>
            </div>
            <button
              className="secondary"
              style={{ width: '100%', marginTop: '14px' }}
              type="button"
              onClick={() => setCartItems([])}
              disabled={cartItems.length === 0}
            >
              Clear Cart
            </button>
          </aside>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ShoppingCart />);
  </script>
</body>
</html>
