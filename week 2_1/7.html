  <title>Korean Bibimbap Recipe</title>
</head>
<body>
  <h1>Korean Bibimbap Recipe</h1>
  <h2>What You Need</h2>
  <ul>
    <li>Rice</li>
    <li>Spinach</li>
    <li>Carrots</li>
    <li>Egg</li>
    <li>Gochujang</li>
  </ul>
  <h2>Steps</h2>
  <ol>
    <li>Cook the rice.</li>
    <li>Cook the vegetables.</li>
    <li><strong>Be careful when frying the egg.</strong></li>
    <li>Put the rice and vegetables in a bowl.</li>
    <li>Add <em>gochujang</em> and mix everything.</li>
  </ol>
</body>
