<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Alt Text</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 24px;
      max-width: 500px;
    }

    .img-placeholder {
      width: 100%;
      height: 80px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 6px;
      border: 2px dashed #999;
    }

    .label {
      font-size: 12px;
      color: #555;
      margin-bottom: 14px;
    }

    button {
      background: #1a7f5a;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    button:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 3px;
    }

    #feedback {
      margin-top: 12px;
      font-size: 14px;
      white-space: pre-line;
    }
  </style>
</head>

<body>

  <h1>Image Alt Text</h1>

  <div class="img-placeholder" style="background:#e0eaff">🏫</div>
  <img
    src=""
    alt="Gachon University main building surrounded by trees"
    style="display:none"
  >
  <p class="label">Image 1: Campus building photo</p>

  <div class="img-placeholder" style="background:#f0fdf4">〰️</div>
  <img src="" alt="" style="display:none">
  <p class="label">Image 2: Decorative wave divider</p>

  <div class="img-placeholder" style="background:#fef3c7">🏫</div>
  <a href="/">
    <img
      src=""
      alt="Gachon University — go to homepage"
      style="display:none"
    >
  </a>
  <p class="label">Image 3: University logo linking to the homepage</p>

  <div class="img-placeholder" style="background:#f5f0ff">📊</div>
  <img
    src=""
    alt="Bar chart showing 1,200 students in 2024, 1,400 in 2025, and 1,476 in 2026"
    style="display:none"
  >
  <p class="label">Image 4: Student enrollment chart</p>

  <button type="button" onclick="checkAlts()">Check my alt text</button>
  <div id="feedback" role="status" aria-live="polite"></div>

  <p><a href="index.html">Back to Week 9</a></p>

  <script>
    function checkAlts() {
      const images = document.querySelectorAll('img');
      const results = [];

      images.forEach((img, i) => {
        const alt = img.getAttribute('alt');

        if (alt === null) {
          results.push('Image ' + (i + 1) + ': missing alt attribute');
        } else if (i === 1 && alt !== '') {
          results.push('Image 2: decorative image should use alt=""');
        } else if (alt === 'image' || alt === 'logo' || alt === 'chart') {
          results.push('Image ' + (i + 1) + ': alt text is too generic');
        } else {
          results.push('Image ' + (i + 1) + ': alt text is set correctly');
        }
      });

      document.getElementById('feedback').textContent = results.join('\n');
    }
  </script>

</body>
</html>
