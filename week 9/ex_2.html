<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Alt Text</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 24px;
      max-width: 500px;
      color: #1e293b;
    }

    .img-placeholder {
      width: 100%;
      height: 80px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      margin-bottom: 6px;
      border: 2px dashed #999;
    }

    .label {
      font-size: 12px;
      color: #666;
      margin-bottom: 14px;
    }

    button {
      padding: 10px 20px;
      background: #1a7f5a;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }

    button:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 3px;
    }
  </style>
</head>

<body>

  <h1>Image Alt Text</h1>

  <div class="img-placeholder" style="background:#e0eaff">🏫</div>
  <img
    src=""
    alt="Gachon University main building surrounded by trees"
    style="display:none"
  >
  <p class="label">Image 1: Campus building photo</p>

  <div class="img-placeholder" style="background:#f0fdf4">〰️</div>
  <img src="" alt="" style="display:none">
  <p class="label">Image 2: Decorative wave</p>

  <div class="img-placeholder" style="background:#fef3c7">🏫</div>
  <a href="../index.html">
    <img
      src=""
      alt="Gachon University homepage"
      style="display:none"
    >
  </a>
  <p class="label">Image 3: University logo</p>

  <div class="img-placeholder" style="background:#f5f0ff">📊</div>
  <img
    src=""
    alt="Bar chart showing enrollment of 1,200 students in 2024, 1,400 in 2025, and 1,476 in 2026"
    style="display:none"
  >
  <p class="label">Image 4: Enrollment chart</p>

  <button type="button" onclick="checkAlts()">Check Alt Text</button>

  <div id="feedback" role="status" aria-live="polite"></div>

  <p><a href="index.html">Back to Week 9</a></p>

  <script>
    function checkAlts() {
      const images = document.querySelectorAll('img');
      const results = [];

      images.forEach((img, i) => {
        const alt = img.getAttribute('alt');
        let correct = false;

        if (i === 0) {
          correct = alt !== null && alt.length > 20;
        } else if (i === 1) {
          correct = alt === '';
        } else if (i === 2) {
          correct = alt !== null &&
            alt.toLowerCase().includes('homepage');
        } else if (i === 3) {
          correct = alt !== null &&
            alt.includes('1,200') &&
            alt.includes('1,400') &&
            alt.includes('1,476');
        }

        results.push(
          correct
            ? 'Image ' + (i + 1) + ': Correct'
            : 'Image ' + (i + 1) + ': Check the alt text'
        );
      });

      document.getElementById('feedback').textContent =
        results.join('\n');
    }
  </script>

</body>
</html>
