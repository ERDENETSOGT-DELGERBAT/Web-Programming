
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Buttons</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #1e293b;
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
    }

    section {
      background: white;
      padding: 24px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
    }

    .submit-btn {
      background: #1a7f5a;
      color: white;
    }

    .close-btn {
      float: right;
      background: #dc2626;
      color: white;
      width: 38px;
      height: 38px;
      padding: 0;
      font-size: 20px;
    }

    button:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 4px;
    }

    #result {
      margin-top: 18px;
    }

    a {
      color: #0f766e;
    }
  </style>
</head>

<body>

  <h1>Accessible Buttons</h1>
  <p>Use Tab to reach the buttons, then press Enter or Space.</p>

  <section id="notice">
    <button
      type="button"
      class="close-btn"
      aria-label="Close notice"
      onclick="closeNotice()"
    >×</button>

    <h2>Form Notice</h2>
    <p>Press the button below to test keyboard and mouse interaction.</p>

    <button
      type="button"
      class="submit-btn"
      onclick="showResult()"
    >Submit Form</button>
  </section>

  <p id="result" role="status" aria-live="polite"></p>

  <p><a href="index.html">Back to Week 9</a></p>

  <script>
    function showResult() {
      document.getElementById('result').textContent =
        'Button activated successfully!';
    }

    function closeNotice() {
      document.getElementById('notice').hidden = true;
      document.getElementById('result').textContent =
        'Notice closed.';
    }
  </script>

</body>
</html>
