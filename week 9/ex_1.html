<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessible Buttons</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 24px;
    }

    .btn {
      display: inline-block;
      background: #1a7f5a;
      color: white;
      padding: 10px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      border: none;
    }

    .btn:focus-visible,
    .close-btn:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 3px;
    }

    .close-btn {
      margin-left: 16px;
      background: #dc2626;
      color: white;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Accessible Buttons</h1>
  <p>Press Tab to reach each button, then press Enter or Space.</p>

  <button class="btn" type="button" onclick="showResult('Submit form')">
    Submit form
  </button>

  <button
    class="close-btn"
    type="button"
    aria-label="Close"
    onclick="showResult('Close')"
  >
    ×
  </button>

  <p id="result" role="status" aria-live="polite"></p>

  <p><a href="index.html">Back to Week 9</a></p>

  <script>
    function showResult(action) {
      document.getElementById('result').textContent =
        action + ' button activated!';
    }
  </script>

</body>
</html>
