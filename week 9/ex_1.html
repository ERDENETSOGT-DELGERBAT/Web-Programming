<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keyboard Access</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f7f5;
      color: #18332b;
      margin: 0;
      padding: 30px;
    }

    main {
      max-width: 700px;
      margin: 30px auto;
    }

    section {
      background: white;
      padding: 28px;
      border: 1px solid #d7e4dd;
      border-radius: 12px;
    }

    h1 {
      color: #176b4d;
    }

    p {
      line-height: 1.6;
    }

    button {
      padding: 12px 18px;
      border: none;
      border-radius: 6px;
      font-size: 15px;
      cursor: pointer;
    }

    .action {
      background: #176b4d;
      color: white;
    }

    .close {
      margin-left: 10px;
      background: #fce8e6;
      color: #8f2520;
      font-size: 18px;
    }

    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #e09f22;
      outline-offset: 4px;
    }

    #result {
      margin-top: 24px;
      padding: 14px;
      background: #edf6f0;
      border-radius: 6px;
    }

    a {
      color: #176b4d;
    }
  </style>
</head>

<body>
  <main>
    <section>
      <h1>Keyboard Access</h1>

      <p>
        Use Tab to move between the buttons. Press Enter or Space
        to activate the selected button.
      </p>

      <button class="action" type="button" id="action-button">
        Test Button
      </button>

      <button
        class="close"
        type="button"
        id="close-button"
        aria-label="Close the test panel"
      >×</button>

      <p id="result" role="status" aria-live="polite">
        Select a button to test it.
      </p>

      <a href="index.html">Back to Week 9</a>
    </section>
  </main>

  <script>
    document.getElementById('action-button').addEventListener('click', function() {
      document.getElementById('result').textContent =
        'The button works with a mouse or keyboard.';
    });

    document.getElementById('close-button').addEventListener('click', function() {
      document.getElementById('result').textContent =
        'The close button was activated.';
    });
  </script>
</body>
</html>
