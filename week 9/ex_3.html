<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessibility Fixes</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      padding: 24px;
      max-width: 400px;
      color: #1e293b;
    }

    label {
      display: block;
      margin: 12px 0 5px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      border: 2px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    input:focus-visible,
    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 3px;
    }

    .error {
      color: #b91c1c;
      font-size: 13px;
      margin: 8px 0;
    }

    button {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .icon-btn {
      background: #1a7f5a;
      color: white;
      width: 36px;
      height: 36px;
      font-size: 18px;
      border-radius: 50%;
    }

    .submit-btn {
      background: #1a56db;
      color: white;
      padding: 10px 24px;
      font-size: 15px;
      width: 100%;
      margin-top: 8px;
    }

    a img {
      display: block;
      width: 80px;
      height: 40px;
      background: #e0eaff;
      border-radius: 4px;
    }
  </style>
</head>

<body>

  <h1>Sign Up</h1>

  <button
    type="button"
    class="icon-btn"
    aria-label="Search"
    onclick="showMessage('Search button activated.')"
  >
    🔍
  </button>

  <label for="email-field">Email address</label>
  <input
    type="email"
    id="email-field"
    placeholder="Email address"
    aria-describedby="email-error"
    required
  >

  <p class="error" id="email-error">
    Error: Enter a valid email address.
  </p>

  <p class="error" role="alert">
    Error: Password too short. Use at least 8 characters.
  </p>

  <button
    type="button"
    class="submit-btn"
    onclick="showMessage('Please correct the errors before creating your account.')"
  >
    Create account
  </button>

  <p id="message" role="status" aria-live="polite"></p>
  </a>

  <p><a href="index.html">Back to Week 9</a></p>

  <script>
    function showMessage(text) {
      document.getElementById('message').textContent = text;
    }

    const email = document.getElementById('email-field');
    const error = document.getElementById('email-error');

    email.addEventListener('input', function() {
      if (email.validity.valid) {
        error.textContent = '';
      } else {
        error.textContent = 'Error: Enter a valid email address.';
      }
    });
  </script>

</body>
</html>
