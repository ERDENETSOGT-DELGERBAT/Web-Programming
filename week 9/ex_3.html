```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accessible Sign Up | Week 9</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f5ff;
            color: #24324b;
            line-height: 1.6;
        }

        header {
            background: #254b87;
            color: white;
            padding: 28px 20px;
            text-align: center;
        }

        header h1 {
            margin: 0 0 8px;
        }

        main {
            width: min(100% - 32px, 540px);
            margin: 35px auto;
        }

        .card {
            background: white;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(25, 50, 90, 0.08);
        }

        h2 {
            margin-top: 0;
        }

        label {
            display: block;
            margin: 18px 0 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #9aabc5;
            border-radius: 7px;
            font: inherit;
        }

        input:focus,
        button:focus,
        a:focus {
            outline: 3px solid #e5a52b;
            outline-offset: 3px;
        }

        input[aria-invalid="true"] {
            border: 2px solid #b42318;
        }

        .help {
            color: #53647e;
            font-size: 14px;
            margin: 5px 0 0;
        }

        button {
            border: 0;
            border-radius: 7px;
            padding: 11px 16px;
            margin-top: 16px;
            background: #254b87;
            color: white;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #193864;
        }

        .error {
            color: #b42318;
            font-size: 14px;
            margin: 5px 0 0;
        }

        #message {
            margin-top: 18px;
            padding: 12px;
            border-radius: 7px;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #53647e;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Create Your Account</h1>
        <p>A simple form designed with accessibility in mind.</p>
    </header>

    <main>
        <section class="card" aria-labelledby="form-title">
            <h2 id="form-title">Sign Up</h2>
            <p>Enter your details below to create an account.</p>

            <button type="button" id="help-button" aria-expanded="false" aria-controls="form-help">
                Show password help
            </button>

            <p id="form-help" hidden>
                Use at least 8 characters for your password. Avoid using a password you already use elsewhere.
            </p>

            <form id="signup-form" novalidate>
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" autocomplete="email" required aria-describedby="email-error">
                <p class="error" id="email-error"></p>

                <label for="password">Password</label>
                <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required aria-describedby="password-error">
                <p class="error" id="password-error"></p>

                <button type="submit">Create Account</button>
            </form>

            <div id="message" role="status" aria-live="polite"></div>
        </section>
    </main>

    <footer>
        Week 9 · Accessible Web Forms
    </footer>

    <script>
        const form = document.getElementById("signup-form");
        const email = document.getElementById("email");
        const password = document.getElementById("password");
        const emailError = document.getElementById("email-error");
        const passwordError = document.getElementById("password-error");
        const message = document.getElementById("message");
        const helpButton = document.getElementById("help-button");
        const formHelp = document.getElementById("form-help");

        helpButton.addEventListener("click", function () {
            const isExpanded = helpButton.getAttribute("aria-expanded") === "true";
            helpButton.setAttribute("aria-expanded", String(!isExpanded));
            formHelp.hidden = isExpanded;
            helpButton.textContent = isExpanded ? "Show password help" : "Hide password help";
        });

        function validateEmail() {
            if (!email.validity.valid) {
                email.setAttribute("aria-invalid", "true");
                emailError.textContent = email.value.trim() === ""
                    ? "Please enter your email address."
                    : "Please enter a valid email address.";
                return false;
            }

            email.removeAttribute("aria-invalid");
            emailError.textContent = "";
            return true;
        }

        function validatePassword() {
            if (password.value.length < 8) {
                password.setAttribute("aria-invalid", "true");
                passwordError.textContent = "Your password must contain at least 8 characters.";
                return false;
            }

            password.removeAttribute("aria-invalid");
            passwordError.textContent = "";
            return true;
        }

        email.addEventListener("input", validateEmail);
        password.addEventListener("input", validatePassword);

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const emailIsValid = validateEmail();
            const passwordIsValid = validatePassword();

            if (emailIsValid && passwordIsValid) {
                message.textContent = "Your form is valid! This demo does not create a real account.";
                message.style.backgroundColor = "#e5f6eb";
                message.style.color = "#17643a";
            } else {
                message.textContent = "Please correct the errors above and try again.";
                message.style.backgroundColor = "#fff0ee";
                message.style.color = "#b42318";

                if (!emailIsValid) {
                    email.focus();
                } else {
                    password.focus();
                }
            }
        });
    </script>
</body>
</html>
