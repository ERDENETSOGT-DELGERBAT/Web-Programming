<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accessibility Fixes</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      color: #1e293b;
      max-width: 400px;
      margin: 35px auto;
      padding: 24px;
    }

    section {
      background: white;
      padding: 24px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    h1 {
      color: #0f766e;
    }

    label {
      display: block;
      margin: 14px 0 6px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 9px;
      border: 2px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    input:focus-visible,
    button:focus-visible,
    a:focus-visible {
      outline: 3px solid #2563eb;
      outline-offset: 3px;
    }

    .error {
      color: #b91c1c;
      font-size: 13px;
    }

    .submit-btn {
      background: #1a56db;
      color: white;
      padding: 10px 24px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      margin-top: 12px;
    }

    .team-link {
      display: inline-block;
      margin-top: 16px;
    }

    .team-link img {
      display: block;
      width: 80px;
      height: 40px;
      background: #e0eaff;
      border-radius: 4px;
    }

    a {
      color: #0f766e;
    }
  </style>
</head>

<body>

  <h1>Sign Up</h1>

  <section>
    <form id="signup-form" novalidate>

      <label for="email-field">Email address</label>
      <input
        type="email"
        id="email-field"
        placeholder="Email address"
        aria-describedby="email-error"
        aria-invalid="false"
        required
      >

      <p class="error" id="email-error" role="alert"></p>

      <p class="error">
        Error: Password too short. Must be at least 8 characters.
      </p>

      <button type="submit" class="submit-btn">Create Account</button>

      <p id="result" role="status" aria-live="polite"></p>
    </form>

    <a class="team-link" href="../index.html">
      <img
        src=""
        alt="Open the Web Programming homepage"
      >
    </a>
  </section>

  <p><a href="index.html">Back to Week 9</a></p>

  <script>
    const form = document.getElementById('signup-form');
    const email = document.getElementById('email-field');
    const error = document.getElementById('email-error');
    const result = document.getElementById('result');

    email.addEventListener('input', function() {
      if (email.validity.valid) {
        error.textContent = '';
        email.setAttribute('aria-invalid', 'false');
      } else {
        error.textContent = 'Error: Enter a valid email address.';
        email.setAttribute('aria-invalid', 'true');
      }
    });

    form.addEventListener('submit', function(event) {
      event.preventDefault();

      if (!form.checkValidity()) {
        error.textContent = 'Error: Enter a valid email address.';
        email.setAttribute('aria-invalid', 'true');
        result.textContent = 'Please correct the error above.';
        return;
      }

      result.textContent = 'Email format is valid.';
    });
  </script>

</body>
</html>
