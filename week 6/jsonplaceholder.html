<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSONPlaceholder</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #1e293b;
      max-width: 800px;
      margin: auto;
      padding: 25px;
    }

    section, article {
      background: white;
      padding: 15px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    h1, h2 {
      color: #0f766e;
    }

    button, input {
      padding: 8px;
      margin: 4px;
    }

    button {
      cursor: pointer;
    }

    a {
      color: #0f766e;
    }
  </style>
</head>

<body>

  <h1>JSONPlaceholder</h1>
  <p>Explore sample blog posts, users and todo lists.</p>
  <p>These are test records, not real blog content.</p>

  <section>
    <button onclick="loadData('posts')">Posts</button>
    <button onclick="loadData('users')">Users</button>
    <button onclick="loadData('todos')">Todos</button>

    <p id="status">Choose a data type above.</p>

    <input
      type="text"
      id="search"
      placeholder="Search results"
      oninput="showData()"
    >

    <div id="results"></div>
  </section>

  <p><a href="index.html">Back to Week 6</a></p>

  <script>
    let records = [];
    let currentType = '';

    async function loadData(type) {
      currentType = type;
      records = [];

      document.getElementById('status').textContent = 'Loading...';
      document.getElementById('results').textContent = '';

      try {
        const res = await fetch(
          'https://jsonplaceholder.typicode.com/' + type
        );

        if (!res.ok) {
          throw new Error('Request failed');
        }

        records = await res.json();

        document.getElementById('search').value = '';
        showData();

      } catch (error) {
        document.getElementById('status').textContent =
          'Could not load the data. Please try again.';
      }
    }

    function showData() {
      let output = document.getElementById('results');
      let search = document.getElementById('search').value.toLowerCase();

      output.textContent = '';

      let filtered = records.filter(item => {
        return JSON.stringify(item).toLowerCase().includes(search);
      });

      document.getElementById('status').textContent =
        'Showing ' + filtered.length + ' of ' + records.length +
        ' ' + currentType + '.';

      for (let item of filtered) {
        let card = document.createElement('article');
        let title = document.createElement('h2');

        if (currentType === 'posts') {
          title.textContent = 'Post #' + item.id;

          let postTitle = document.createElement('h3');
          postTitle.textContent = item.title;

          let body = document.createElement('p');
          body.textContent = item.body;

          card.appendChild(title);
          card.appendChild(postTitle);
          card.appendChild(body);
        } else if (currentType === 'users') {
          title.textContent = item.name;

          let username = document.createElement('p');
          username.textContent = 'Username: ' + item.username;

          let email = document.createElement('p');
          email.textContent = 'Email: ' + item.email;

          let company = document.createElement('p');
          company.textContent = 'Company: ' + item.company.name;

          card.appendChild(title);
          card.appendChild(username);
          card.appendChild(email);
          card.appendChild(company);
        } else {
          title.textContent = item.title;

          let user = document.createElement('p');
          user.textContent = 'User ID: ' + item.userId;

          let status = document.createElement('p');
          status.textContent = item.completed
            ? 'Status: Completed'
            : 'Status: Not completed';

          card.appendChild(title);
          card.appendChild(user);
          card.appendChild(status);
        }

        output.appendChild(card);
      }
    }
  </script>

</body>
</html>
