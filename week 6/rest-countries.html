<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REST Countries</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #1e293b;
      max-width: 1000px;
      margin: auto;
      padding: 25px;
    }

    section {
      background: white;
      padding: 18px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    h1 {
      color: #0f766e;
    }

    input, select, button {
      padding: 9px;
      margin: 4px;
    }

    button {
      cursor: pointer;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      background: white;
      margin-top: 15px;
    }

    th, td {
      padding: 10px;
      border: 1px solid #ddd;
      text-align: left;
    }

    th {
      background: #e2e8f0;
    }

    img {
      width: 45px;
    }

    a {
      color: #0f766e;
    }
  </style>
</head>

<body>

  <h1>REST Countries</h1>
  <p>Explore country flags, capitals, regions and populations.</p>

  <section>
    <input
      type="text"
      id="search"
      placeholder="Search country or capital"
      oninput="showCountries()"
    >

    <select id="region" onchange="showCountries()">
      <option value="">All regions</option>
      <option value="Africa">Africa</option>
      <option value="Americas">Americas</option>
      <option value="Asia">Asia</option>
      <option value="Europe">Europe</option>
      <option value="Oceania">Oceania</option>
      <option value="Antarctic">Antarctic</option>
    </select>

    <button onclick="loadCountries()">Reload Countries</button>

    <p id="status">Loading country data...</p>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Flag</th>
            <th>Country</th>
            <th>Capital</th>
            <th>Region</th>
            <th>Population</th>
          </tr>
        </thead>
        <tbody id="countries"></tbody>
      </table>
    </div>
  </section>

  <p><a href="index.html">Back to Week 6</a></p>

  <script>
    let countries = [];

    async function loadCountries() {
      document.getElementById('status').textContent =
        'Loading countries...';

      document.getElementById('countries').textContent = '';

      try {
        const res = await fetch(
          'https://restcountries.com/v3.1/all?fields=name,capital,population,flags,region,cca2'
        );

        if (!res.ok) {
          throw new Error('Request failed');
        }

        countries = await res.json();

        countries.sort((a, b) =>
          a.name.common.localeCompare(b.name.common)
        );

        showCountries();
      } catch (error) {
        document.getElementById('status').textContent =
          'Could not load countries. Please try again.';
      }
    }

    function showCountries() {
      let search = document.getElementById('search').value.toLowerCase();
      let region = document.getElementById('region').value;
      let table = document.getElementById('countries');

      table.textContent = '';

      let filtered = countries.filter(country => {
        let name = country.name.common.toLowerCase();
        let capital = country.capital
          ? country.capital.join(' ').toLowerCase()
          : '';

        return (name.includes(search) || capital.includes(search)) &&
          (region === '' || country.region === region);
      });

      document.getElementById('status').textContent =
        'Showing ' + filtered.length + ' of ' + countries.length + ' countries.';

      for (let country of filtered) {
        let row = document.createElement('tr');
        let flagCell = document.createElement('td');
        let nameCell = document.createElement('td');
        let capitalCell = document.createElement('td');
        let regionCell = document.createElement('td');
        let populationCell = document.createElement('td');

        let flag = document.createElement('img');
        flag.src = country.flags.png;
        flag.alt = country.name.common + ' flag';

        flagCell.appendChild(flag);
        nameCell.textContent = country.name.common;
        capitalCell.textContent = country.capital
          ? country.capital.join(', ')
          : 'Not available';
        regionCell.textContent = country.region || 'Not available';
        populationCell.textContent =
          country.population.toLocaleString();

        row.appendChild(flagCell);
        row.appendChild(nameCell);
        row.appendChild(capitalCell);
        row.appendChild(regionCell);
        row.appendChild(populationCell);

        table.appendChild(row);
      }
    }

    loadCountries();
  </script>

</body>
</html>
