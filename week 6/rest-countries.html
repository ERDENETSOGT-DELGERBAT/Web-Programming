<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>REST Countries</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #1e293b;
      max-width: 700px;
      margin: auto;
      padding: 25px;
    }

    section {
      background: white;
      padding: 20px;
      margin-bottom: 18px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    h1, h2 {
      color: #0f766e;
    }

    input, button {
      padding: 9px;
      margin: 4px 0;
    }

    input {
      width: 65%;
      max-width: 350px;
    }

    button {
      cursor: pointer;
    }

    .country {
      background: white;
      padding: 18px;
      margin-top: 15px;
      border: 1px solid #ddd;
      border-radius: 8px;
    }

    .flag {
      max-width: 180px;
      max-height: 120px;
      object-fit: contain;
    }

    .detail {
      border-bottom: 1px solid #eee;
      padding: 8px 0;
    }

    a {
      color: #0f766e;
    }
  </style>
</head>

<body>

  <h1>REST Countries</h1>
  <p>Search a country to explore its flag, capital and population.</p>

  <section>
    <input
      type="text"
      id="countryInput"
      value="South Korea"
      placeholder="Enter a country name"
    >
    <button onclick="searchCountry()">Search</button>

    <p id="status">Loading country...</p>
    <div id="results"></div>
  </section>

  <p><a href="index.html">Back to Week 6</a></p>

  <script>
    async function searchCountry() {
      let name = document.getElementById('countryInput').value.trim();
      let output = document.getElementById('results');

      output.textContent = '';

      if (name === '') {
        document.getElementById('status').textContent =
          'Please enter a country name.';
        return;
      }

      document.getElementById('status').textContent = 'Searching...';

      try {
        const res = await fetch(
          'https://restcountries.com/v3.1/name/' +
          encodeURIComponent(name) +
          '?fields=name,capital,population,flags,region,area,languages,currencies'
        );

        if (!res.ok) {
          throw new Error('Country not found');
        }

        const countries = await res.json();

        document.getElementById('status').textContent =
          countries.length + ' matching result(s).';

        for (let country of countries) {
          let card = document.createElement('div');
          card.className = 'country';

          let title = document.createElement('h2');
          title.textContent = country.name.common;

          let flag = document.createElement('img');
          flag.className = 'flag';
          flag.src = country.flags.png;
          flag.alt = country.name.common + ' flag';

          let details = [
            ['Official name', country.name.official],
            ['Capital', country.capital ? country.capital.join(', ') : 'Not available'],
            ['Population', country.population.toLocaleString()],
            ['Region', country.region || 'Not available'],
            ['Area', country.area ? country.area.toLocaleString() + ' km²' : 'Not available'],
            ['Languages', country.languages ? Object.values(country.languages).join(', ') : 'Not available'],
            ['Currency', country.currencies ? Object.values(country.currencies).map(item => item.name).join(', ') : 'Not available']
          ];

          card.appendChild(title);
          card.appendChild(flag);

          for (let item of details) {
            let row = document.createElement('p');
            row.className = 'detail';
            row.textContent = item[0] + ': ' + item[1];
            card.appendChild(row);
          }

          output.appendChild(card);
        }
      } catch (error) {
        document.getElementById('status').textContent =
          'Country not found or the service is unavailable. Try a name such as Mongolia, Japan or South Korea.';
      }
    }

    document.getElementById('countryInput').addEventListener('keydown', function (event) {
      if (event.key === 'Enter') {
        searchCountry();
      }
    });

    searchCountry();
  </script>

</body>
</html>
