<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Validation</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 30px auto;
      padding: 20px;
      background: #f5f5f5;
      color: #1e293b;
    }

    label {
      display: block;
      margin: 14px 0 5px;
    }

    input {
      padding: 9px;
      width: 100%;
      box-sizing: border-box;
    }

    button {
      margin-top: 20px;
      padding: 10px 18px;
    }
  </style>
</head>

<body>

  <h1>Form Validation</h1>

  <form method="post" action="#">

    <label for="sid">Student ID</label>
    <input
      type="text"
      id="sid"
      name="student_id"
      pattern="[0-9]{9}"
      required
      title="Enter your 9-digit student ID"
      placeholder="202112345"
    >

    <label for="r-email">Email</label>
    <input
      type="email"
      id="r-email"
      name="email"
      required
      placeholder="name@gachon.ac.kr"
    >

    <label for="r-pw">Password</label>
    <input
      type="password"
      id="r-pw"
      name="password"
      minlength="8"
      required
      placeholder="At least 8 characters"
    >

    <label for="r-age">Age</label>
    <input
      type="number"
      id="r-age"
      name="age"
      min="16"
      max="100"
      required
      placeholder="Enter your age"
    >

    <button type="submit">Submit</button>

  </form>

  <p>Try invalid values to see the browser's validation messages.</p>

</body>
</html>
